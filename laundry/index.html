<title>Washer and Dryer Guide | Blue Plane Stay</title>
<style>
:root{--navy:#14203A;--ink:#1B2233;--mute:#6E7484;--paper:#FFFCF6;--line:#E2D9C8;--mint:#2E9A8B;--mint-soft:#E4F4F0;--amber:#EFC27A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","PingFang SC","Microsoft YaHei","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.55;font-size:16px}
main{max-width:680px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;line-height:1.25;margin:4px 0 4px;color:var(--navy)}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
img{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#fff}
.lead{background:var(--mint-soft);border-radius:12px;padding:10px 12px;margin:14px 0}
ol{padding-left:0;list-style:none;margin:0;display:flex;flex-direction:column;gap:8px}
#t-list li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#t-list li b{color:var(--navy)}
.tips li{margin:2px 0}
.kr{display:inline-block;font-size:13px;background:#F3ECDF;border-radius:6px;padding:0 6px;margin-left:4px}
.tips{margin-top:14px;background:#FFF6E3;border:1px solid var(--amber);border-radius:12px;padding:10px 12px}
.tips ul{margin:4px 0 0;padding-left:18px}
footer{margin-top:18px;color:var(--mute);font-size:13px;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.brand{color:var(--mute);font-size:14px}
.lang{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 6px 4px 12px}
.lang select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:4px 2px;max-width:170px}
.lang:focus-within{outline:2px solid var(--mint);outline-offset:2px}
.pic{position:relative;container-type:inline-size;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pic img{display:block;border:0;border-radius:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);font-size:14px}
.legend .g{display:flex;flex-direction:column;gap:3px}
.legend .g>b{color:var(--navy);font-size:13px}
.legend .full{grid-column:1 / -1}
.num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--navy);font-weight:700;font-size:12px;margin-right:6px;border:1.5px solid var(--navy)}
.step{margin-top:8px;border-radius:10px;width:100%;max-width:320px;display:block}
.cap{margin:6px 0 0;font-size:14px;background:#FFF6E3;border-radius:8px;padding:6px 8px}
.hint{margin:6px 2px 0;font-size:13px;color:var(--mute)}
.pic img,.shots img{cursor:zoom-in}
#zoom{position:fixed;inset:0;z-index:50;background:rgba(20,32,58,.94);overflow:auto;-webkit-overflow-scrolling:touch}
#zoom[hidden]{display:none}
#zoomIn{padding:58px 10px 28px;width:max-content;min-width:100%}
#zoomIn .pic{width:1000px;max-width:none;cursor:default}
#zoomIn .zimg{display:block;max-width:none;height:auto;border-radius:10px;border:0}
#zoomX{position:fixed;top:10px;right:12px;z-index:51;font:inherit;font-size:22px;line-height:1;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--navy);cursor:pointer}
#zoomX:focus-visible{outline:3px solid var(--amber)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;align-items:start}
.shots img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.home{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;text-decoration:none;font-size:19px;margin-right:8px;vertical-align:middle}
.home:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.brand{display:inline-flex;align-items:center;white-space:nowrap}
@media (max-width:420px){.brand .bname{display:none}}
.top{position:sticky;top:0;z-index:20;background:var(--paper);margin:0 -16px 6px;padding:8px 16px;box-shadow:0 1px 0 var(--line)}
</style>
</head>

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const zoom = document.getElementById("zoom"), zoomIn = document.getElementById("zoomIn");
function openZoom(html) { zoomIn.innerHTML = html; zoom.hidden = false; document.body.style.overflow = "hidden"; zoom.scrollTo(0, 0); document.getElementById("zoomX").focus(); }
function closeZoom() { zoom.hidden = true; zoomIn.innerHTML = ""; document.body.style.overflow = ""; }
document.getElementById("zoomX").addEventListener("click", closeZoom);
zoom.addEventListener("click", e => { if (e.target === zoom || e.target === zoomIn) closeZoom(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !zoom.hidden) closeZoom(); });
const zoomImg = img => openZoom(`<img class="zimg" src="${img.getAttribute("src")}" alt="" style="width:${Math.max(img.naturalWidth || 600, 360)}px">`);
function show(l){
  const t = T[l] || T.en;
  document.documentElement.lang = l;
  document.getElementById("home").href = "../guide/?lang=" + encodeURIComponent(l);
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-lead").textContent = t.lead;
  document.getElementById("t-list").innerHTML = t.items.map(([h, d, k]) => `<li><b>${esc(h)}</b>${k ? `<span class="kr">${esc(k)}</span>` : ""}<br>${esc(d)}</li>`).join("");
  const S = SHORT[l] || SHORT.en, n = (i, w) => `<span><span class="num">${i}</span>${esc(w)}</span>`;
  document.getElementById("legend").innerHTML =
    `<div class="full">${n(1, S[0])}</div>` +
    `<div class="g"><b>${esc(S[4])}</b>${n(2, S[1])}${n(3, S[2])}${n(4, S[3])}</div>` +
    `<div class="g"><b>${esc(S[5])}</b>${n(5, S[1])}${n(6, S[2])}${n(7, S[3])}</div>`;
  document.querySelector("#t-list li").insertAdjacentHTML("beforeend", '<div class="shots"><img src="detergent.jpg" alt="" width="600" height="660"><img src="bottles.jpg" alt="" width="480" height="693"><img src="drawer.jpg" alt="" width="600" height="680"></div>' + `<p class="cap">${esc(DRAWER[l] || DRAWER.en)}</p>`);
  document.getElementById("t-hint").textContent = "🔍 " + (HINT[l] || HINT.en);
  document.getElementById("t-tips-h").textContent = t.tipsH;
  document.getElementById("t-tips").innerHTML = t.tips.map(x => `<li>${esc(x)}</li>`).join("");
  document.getElementById("lang").value = T[l] ? l : "en";
  try { localStorage.setItem("laundry_lang", l); } catch (e) {}
}
document.getElementById("lang").addEventListener("change", e => show(e.target.value));
document.addEventListener("click", e => { const img = e.target.closest(".pic img, .shots img"); if (img && !img.closest("#zoom")) zoomImg(img); });
let pick = "en";
try { pick = localStorage.getItem("laundry_lang") || ""; } catch (e) { pick = ""; }
const qLang = new URLSearchParams(location.search).get("lang");
if (qLang && T[qLang]) pick = qLang;
if (!pick) {
  const n = (navigator.language || "en").toLowerCase();
  const base = n.split("-")[0];
  pick = n.startsWith("zh") ? (/tw|hk|hant/.test(n) ? "zh-Hant" : "zh-Hans") : (["ko","ja","vi","th","id","es","fr","de","ms","tl","ru","mn"].includes(base) ? base : ({in: "id", fil: "tl"}[base] || "en"));
}
show(pick);
</script>
