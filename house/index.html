<style>

.home{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;text-decoration:none;font-size:19px;margin-right:8px;vertical-align:middle}

 10분 1,000원, 하루 최대 30,000원, 자정이 지나면 새로 계산).", "계단이 다소 높아요. 오른쪽 손잡이를 잡고 천천히 이동해 주세요. 짐 올리는 게 필요하시면 말씀해 주세요."]], ["2. 숙소 안", ["와이파이: blueplane / 비밀번호: 12341234", "일괄 소등 스위치: 입구 오른쪽 벽", "TV: 사용법은 [[TV 안내|tv]]를 봐 주세요.", "온수: 뜨거운 물이 나오기까지 조금 걸려요. 잠시 틀어 두고 기다려 주세요.", "욕실: 샴푸, 바디워시, 컨디셔너 / 건식 세면대: 헤어드라이어, 고데기", "침구, 수건, 슬리퍼, 발매트는 매 숙박 후 세탁해요."]], ["3. 지켜 주세요", ["외출하거나 퇴실할 때는 조명, 에어컨, 콘센트 전원을 꺼 주세요.", "실내에서는 신발을 벗어 주세요.", "객실과 발코니 모두 금연이에요(위반 시 최대 20만 원 벌금).", "강한 냄새가 나는 음식은 조리 금지, 간단한 구이 정도만 돼요. 요리할 때는 천장 환풍기를 켜 주세요.", "고출력 가전(건조기, 세탁기, 인덕션, 전자레인지, 헤어드라이어)은 한 번에 하나씩 써 주세요.", "세탁기 옆 'Staff Only' 방은 출입 금지예요.", "심한 파손이나 얼룩은 추가 요금이 생길 수 있어요. 침대에서는 음식을 드시지 말아 주세요.", "쓰레기: [[별도 안내|trash]]를 봐 주세요."]], ["4. 체크아웃", ["오전 11시까지예요. 늦어지면 10분 단위로 추가 요금이 생길 수 있어요."]]], "thanks": "다음 게스트를 위한 준비에 도움을 주셔서 감사합니다"}, "zh-Hans": {"title": "入住须知", "lead": "欢迎入住 Blue Plane Stay", "secs": [["1. 抵达", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong)。就是一楼有 '고기온' 招牌的那栋楼。", "入住时间 4:00 PM 起 / 退房时间 11:00 AM 前", "自助入住：入住当天 3:00 PM 我们会发送门锁密码。", "楼内无法停车。可使用隔壁 CJ 大厦的地下停车场（24 小时营业，每 10 分钟 KRW 1,000，每天最高 KRW 30,000，过了午夜重新计费）。", "楼梯较陡，请扶着右侧扶手慢慢走。需要帮忙搬行李的话，请告诉我们。"]], ["2. 房内", ["Wi-Fi：blueplane / 密码：12341234", "全屋灯光总开关：入口右侧墙上", "电视：使用方法请看[[电视使用说明|tv]]。", "热水需要稍等一会儿，请先开着水龙头稍候。", "浴室：洗发水、沐浴露、护发素 / 干区洗手台：吹风机、直发器", "床品、毛巾、拖鞋和浴室脚垫在每次住宿后都会清洗。"]], ["3. 注意事项", ["外出或退房时，请关闭灯、空调和插座电源。", "室内请脱鞋。", "房间和阳台均禁止吸烟（违者最高罚款 KRW 200,000）。", "请勿烹饪气味浓烈的食物，简单烤制可以。做饭时请打开天花板上的排气扇。", "大功率电器（烘干机、洗衣机、电磁炉、微波炉、吹风机）请一次只用一台。", "洗衣机旁边的 'Staff Only' 房间禁止进入。", "严重损坏或污渍可能会产生额外费用。请勿在床上吃东西。", "垃圾：请看单独的[[垃圾投放说明|trash]]。"]], ["4. 退房", ["请在 11:00 AM 前退房。延迟退房可能按每 10 分钟加收费用。"]]], "thanks": "感谢您帮助我们为下一位客人做好准备"}, "zh-Hant": {"title": "入住須知", "lead": "歡迎入住 Blue Plane Stay", "secs": [["1. 抵達", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong)。就是一樓有 '고기온' 招牌的那棟樓。", "入住時間 4:00 PM 起 / 退房時間 11:00 AM 前", "自助入住：入住當天 3:00 PM 我們會傳送門鎖密碼。", "大樓內無法停車。可使用隔壁 CJ 大樓的地下停車場（24 小時營業，每 10 分鐘 KRW 1,000，每天最高 KRW 30,000，過了午夜重新計費）。", "樓梯較陡，請扶著右側扶手慢慢走。需要幫忙搬行李的話，請告訴我們。"]], ["2. 房內", ["Wi-Fi：blueplane / 密碼：12341234", "全屋燈光總開關：入口右側牆上", "電視：使用方法請看[[電視使用說明|tv]]。", "熱水需要稍等一下，請先開著水龍頭稍候。", "浴室：洗髮精、沐浴乳、潤髮乳 / 乾區洗手台：吹風機、離子夾", "寢具、毛巾、拖鞋和浴室腳踏墊在每次住宿後都會清洗。"]], ["3. 注意事項", ["外出或退房時，請關閉燈、冷氣和插座電源。", "室內請脫鞋。", "房間和陽台全面禁菸（違者最高罰款 KRW 200,000）。", "請勿烹調氣味濃烈的食物，簡單燒烤可以。做菜時請打開天花板上的抽風機。", "高功率電器（烘乾機、洗衣機、電磁爐、微波爐、吹風機）請一次只用一台。", "洗衣機旁邊的 'Staff Only' 房間禁止進入。", "嚴重損壞或污漬可能會另外收費。請勿在床上吃東西。", "垃圾：請看另外的[[垃圾丟棄說明|trash]]。"]], ["4. 退房", ["請在 11:00 AM 前退房。延遲退房可能按每 10 分鐘加收費用。"]]], "thanks": "感謝您幫助我們為下一位客人做好準備"}, "ja": {"title": "ご滞在のご案内", "lead": "Blue Plane Stay へようこそ", "secs": [["1. ご到着", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong)。一階に '고기온' の看板がある建物です。", "チェックイン 4:00 PM から / チェックアウト 11:00 AM まで", "セルフチェックイン：チェックイン当日の 3:00 PM にドアロックの暗証番号をお送りします。", "建物内に駐車場はありません。隣の CJ ビルの地下駐車場をご利用ください（24 時間営業、10 分ごとに KRW 1,000、一日の上限 KRW 30,000、日付が変わると料金は新たに計算）。", "階段が急です。右側の手すりにつかまって、ゆっくりご移動ください。荷物を運ぶお手伝いが必要でしたら、お気軽にお知らせください。"]], ["2. お部屋の中", ["Wi-Fi：blueplane / パスワード：12341234", "照明の一括スイッチ：入口の右側の壁", "テレビ：使い方は[[テレビの使い方|tv]]をご覧ください。", "お湯が出るまで少し時間がかかります。しばらく出したままお待ちください。", "浴室：シャンプー、ボディソープ、コンディショナー / 洗面台：ヘアドライヤー、ヘアアイロン", "寝具、タオル、スリッパ、バスマットはご宿泊ごとに洗濯しています。"]], ["3. お守りください", ["外出やチェックアウトの際は、照明、エアコン、コンセントの電源をお切りください。", "室内では靴をお脱ぎください。", "お部屋とバルコニーを含め全面禁煙です（違反時は最大 KRW 200,000 の罰金）。", "においの強い料理はご遠慮ください（簡単な焼き物は大丈夫です）。調理中は天井の換気扇をつけてください。", "消費電力の大きい家電（乾燥機、洗濯機、IH コンロ、電子レンジ、ヘアドライヤー）は一度にひとつずつお使いください。", "洗濯機の横の 'Staff Only' の部屋には入らないでください。", "ひどい破損や汚れは追加料金をいただく場合があります。ベッドの上でのお食事はご遠慮ください。", "ゴミ：別ページの[[ゴミの出し方|trash]]をご覧ください。"]], ["4. チェックアウト", ["11:00 AM までにお願いします。遅れた場合は 10 分単位で追加料金が発生することがあります。"]]], "thanks": "次のお客様を迎える準備にご協力いただき、ありがとうございます"}, "vi": {"title": "Thông tin lưu trú", "lead": "Chào mừng bạn đến với Blue Plane Stay", "secs": [["1. Khi đến", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). Tòa nhà có biển '고기온' ở tầng trệt.", "Nhận phòng từ 4:00 PM / Trả phòng trước 11:00 AM", "Tự nhận phòng: chúng tôi sẽ gửi mã khóa cửa lúc 3:00 PM vào ngày nhận phòng.", "Tòa nhà không có chỗ đậu xe. Bạn có thể dùng bãi đậu xe tầng hầm của tòa nhà CJ ngay bên cạnh (mở 24 giờ, KRW 1,000 cho mỗi 10 phút, tối đa KRW 30,000 mỗi ngày, tính lại từ đầu sau nửa đêm).", "Cầu thang khá dốc. Vui lòng vịn tay vịn bên phải và đi chậm. Nếu cần giúp mang hành lý, xin cứ báo cho chúng tôi."]], ["2. Trong căn hộ", ["Wi-Fi: blueplane / Mật khẩu: 12341234", "Công tắc tắt toàn bộ đèn: trên tường bên phải lối vào", "TV: vui lòng xem [[Hướng dẫn dùng TV|tv]] để biết cách sử dụng.", "Nước nóng cần một lúc mới ra. Vui lòng để vòi chảy một chút và chờ.", "Phòng tắm: dầu gội, sữa tắm, dầu xả / Bồn rửa mặt bên ngoài: máy sấy tóc, máy duỗi tóc", "Chăn ga gối, khăn tắm, dép và thảm chùi chân được giặt sau mỗi lượt khách."]], ["3. Xin lưu ý", ["Khi ra ngoài hoặc trả phòng, vui lòng tắt đèn, máy lạnh và nguồn điện ổ cắm.", "Vui lòng không mang giày trong nhà.", "Cấm hút thuốc ở mọi nơi, kể cả ban công (phạt tối đa KRW 200,000).", "Không nấu món có mùi nặng (nướng đơn giản thì được). Khi nấu ăn, vui lòng bật quạt thông gió trên trần.", "Mỗi lần chỉ dùng một thiết bị công suất lớn (máy sấy, máy giặt, bếp từ, lò vi sóng, máy sấy tóc).", "Không vào phòng 'Staff Only' cạnh máy giặt.", "Hư hỏng nặng hoặc vết bẩn nặng có thể bị tính phí. Vui lòng không ăn trên giường.", "Rác: vui lòng xem trang riêng [[Hướng dẫn bỏ rác|trash]]."]], ["4. Trả phòng", ["Trước 11:00 AM. Trả phòng muộn có thể bị tính phí theo từng 10 phút."]]], "thanks": "Cảm ơn bạn đã giúp chúng tôi chuẩn bị cho những vị khách tiếp theo"}, "th": {"title": "ข้อมูลการเข้าพัก", "lead": "ยินดีต้อนรับสู่ Blue Plane Stay", "secs": [["1. การเดินทางมาถึง", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong) อาคารที่มีป้าย '고기온' อยู่ชั้นล่าง", "เช็คอินตั้งแต่ 4:00 PM / เช็คเอาท์ภายใน 11:00 AM", "เช็คอินด้วยตนเอง: เราจะส่งรหัสประตูให้เวลา 3:00 PM ของวันเช็คอิน", "ไม่มีที่จอดรถในอาคาร แนะนำลานจอดรถใต้ดินของอาคาร CJ ที่อยู่ติดกัน (เปิด 24 ชั่วโมง ทุก 10 นาที KRW 1,000 สูงสุดวันละ KRW 30,000 เริ่มนับใหม่หลังเที่ยงคืน)", "บันไดค่อนข้างชัน กรุณาจับราวบันไดด้านขวาและเดินช้าๆ หากต้องการให้ช่วยยกกระเป๋า แจ้งเราได้เลย"]], ["2. ภายในห้องพัก", ["Wi-Fi: blueplane / รหัสผ่าน: 12341234", "สวิตช์ปิดไฟทั้งหมด: ผนังด้านขวาของทางเข้า", "ทีวี: ดูวิธีใช้ได้ที่ [[วิธีใช้ทีวี|tv]]", "น้ำอุ่นต้องรอสักครู่ กรุณาเปิดน้ำทิ้งไว้สักพัก", "ห้องน้ำ: แชมพู ครีมอาบน้ำ ครีมนวดผม / อ่างล้างหน้าด้านนอก: ไดร์เป่าผม เครื่องหนีบผม", "ผ้าปูที่นอน ผ้าเช็ดตัว รองเท้าแตะ และพรมเช็ดเท้า ซักใหม่ทุกครั้งหลังการเข้าพักแต่ละครั้ง"]], ["3. โปรดปฏิบัติ", ["เมื่อออกไปข้างนอกหรือเช็คเอาท์ กรุณาปิดไฟ แอร์ และปลั๊กไฟ", "กรุณาถอดรองเท้าก่อนเข้าห้อง", "ห้ามสูบบุหรี่ทุกพื้นที่ รวมถึงระเบียง (ปรับสูงสุด KRW 200,000)", "ห้ามทำอาหารที่มีกลิ่นแรง (ย่างง่ายๆ ได้) ขณะทำอาหารกรุณาเปิดพัดลมระบายอากาศบนเพดาน", "กรุณาใช้เครื่องใช้ไฟฟ้ากำลังสูงทีละเครื่อง (เครื่องอบผ้า เครื่องซักผ้า เตาแม่เหล็กไฟฟ้า ไมโครเวฟ ไดร์เป่าผม)", "ห้ามเข้าห้อง 'Staff Only' ที่อยู่ข้างเครื่องซักผ้า", "ความเสียหายหรือคราบสกปรกร้ายแรงอาจมีค่าใช้จ่ายเพิ่มเติม กรุณาอย่ารับประทานอาหารบนเตียง", "ขยะ: กรุณาดูหน้า [[วิธีทิ้งขยะ|trash]] แยกต่างหาก"]], ["4. เช็คเอาท์", ["ภายใน 11:00 AM หากเช็คเอาท์ช้า อาจมีค่าใช้จ่ายเพิ่มทุก 10 นาที"]]], "thanks": "ขอบคุณที่ช่วยให้เราเตรียมพร้อมสำหรับผู้เข้าพักท่านต่อไป"}, "id": {"title": "Informasi Penginapan", "lead": "Selamat datang di Blue Plane Stay", "secs": [["1. Kedatangan", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). Gedung dengan papan nama '고기온' di lantai dasar.", "Check-in mulai 4:00 PM / Check-out paling lambat 11:00 AM", "Check-in mandiri: kami mengirim kode kunci pintu pukul 3:00 PM pada hari check-in Anda.", "Tidak ada parkir di gedung. Silakan gunakan parkir bawah tanah Gedung CJ di sebelah (24 jam, KRW 1,000 per 10 menit, maksimal KRW 30,000 per hari, dihitung ulang setelah tengah malam).", "Tangganya curam. Mohon berpegangan pada pegangan tangan sebelah kanan. Perlu bantuan membawa barang? Kabari kami saja."]], ["2. Di dalam apartemen", ["Wi-Fi: blueplane / Kata sandi: 12341234", "Sakelar utama lampu: di dinding kanan pintu masuk", "TV: cara pakainya bisa dilihat di [[Panduan TV|tv]].", "Air panas perlu waktu sebentar. Biarkan keran mengalir sejenak.", "Kamar mandi: sampo, sabun mandi, kondisioner / Wastafel kering: pengering rambut, catokan rambut", "Seprai, handuk, sandal, dan keset kamar mandi dicuci setiap selesai menginap."]], ["3. Mohon diperhatikan", ["Saat keluar atau check-out, mohon matikan lampu, AC, dan stopkontak.", "Mohon lepas sepatu di dalam ruangan.", "Dilarang merokok di mana pun, termasuk balkon (denda hingga KRW 200,000).", "Jangan memasak makanan berbau tajam (memanggang sederhana boleh). Nyalakan kipas ventilasi di plafon saat memasak.", "Gunakan hanya satu alat listrik berdaya tinggi dalam satu waktu (pengering, mesin cuci, kompor induksi, microwave, pengering rambut).", "Ruangan 'Staff Only' di samping mesin cuci tidak boleh dimasuki.", "Kerusakan atau noda yang parah dapat dikenai biaya. Mohon jangan makan di atas tempat tidur.", "Sampah: silakan lihat halaman terpisah [[Panduan Buang Sampah|trash]]."]], ["4. Check-out", ["Paling lambat 11:00 AM. Check-out terlambat dapat dikenai biaya per 10 menit."]]], "thanks": "Terima kasih telah membantu kami bersiap untuk tamu berikutnya"}, "es": {"title": "Guía de la casa", "lead": "Le damos la bienvenida a Blue Plane Stay", "secs": [["1. Llegada", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). Es el edificio con el letrero '고기온' en la planta baja.", "Entrada desde las 4:00 PM / Salida antes de las 11:00 AM", "Entrada autónoma: le enviamos el código de la cerradura a las 3:00 PM el día de su llegada.", "No hay aparcamiento en el edificio. Puede usar el aparcamiento subterráneo del edificio CJ, justo al lado (24 horas, KRW 1,000 cada 10 min, máximo KRW 30,000 por día; la tarifa diaria se reinicia a medianoche).", "Las escaleras son empinadas. Sujétese al pasamanos de la derecha. ¿Necesita ayuda con el equipaje? Solo avísenos."]], ["2. En el apartamento", ["Wi-Fi: blueplane / Contraseña: 12341234", "Interruptor general de luces: en la pared derecha de la entrada", "TV: para saber cómo usarla, consulte la [[Guía de la TV|tv]].", "El agua caliente tarda un poco. Deje el grifo abierto unos momentos.", "Baño: champú, gel de baño, acondicionador / Lavabo exterior: secador de pelo, plancha de pelo", "La ropa de cama, las toallas, las zapatillas y las alfombrillas de baño se lavan después de cada estancia."]], ["3. Tenga en cuenta", ["Al salir o al irse, apague las luces, el aire acondicionado y los enchufes.", "No use zapatos dentro del apartamento.", "Prohibido fumar en todo el alojamiento, incluido el balcón (multa de hasta KRW 200,000).", "No cocine alimentos de olor fuerte (asar algo sencillo está bien). Encienda el extractor del techo mientras cocina.", "Use un solo aparato de alta potencia a la vez (secadora, lavadora, placa de inducción, microondas, secador de pelo).", "No se permite entrar en la sala 'Staff Only' junto a la lavadora.", "Los daños graves o las manchas importantes pueden tener un cargo. Por favor, no coma en las camas.", "Basura: consulte la guía aparte, [[Cómo tirar la basura|trash]]."]], ["4. Salida", ["Antes de las 11:00 AM. La salida tardía puede tener un cargo por cada 10 minutos."]]], "thanks": "Gracias por ayudarnos a preparar todo para los próximos huéspedes"}, "fr": {"title": "Livret d'accueil", "lead": "Bienvenue au Blue Plane Stay", "secs": [["1. Arrivée", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). C'est l'immeuble avec l'enseigne '고기온' au rez-de-chaussée.", "Arrivée à partir de 4:00 PM / Départ avant 11:00 AM", "Arrivée autonome : nous vous envoyons le code de la serrure à 3:00 PM le jour de votre arrivée.", "Pas de stationnement dans l'immeuble. Vous pouvez utiliser le parking souterrain de l'immeuble CJ juste à côté (ouvert 24 h, KRW 1,000 par tranche de 10 min, maximum KRW 30,000 par jour, remise à zéro à minuit).", "L'escalier est raide. Tenez bien la rampe de droite. Besoin d'aide pour vos bagages ? Dites-le-nous simplement."]], ["2. Dans le logement", ["Wi-Fi : blueplane / Mot de passe : 12341234", "Interrupteur général des lumières : sur le mur de droite, à l'entrée", "TV : pour l'utiliser, consultez le [[Mode d'emploi de la TV|tv]].", "L'eau chaude met un moment à arriver. Laissez couler le robinet quelques instants.", "Salle de bain : shampooing, gel douche, après-shampooing / Coin lavabo : sèche-cheveux, lisseur", "Le linge de lit, les serviettes, les chaussons et les tapis de bain sont lavés après chaque séjour."]], ["3. À respecter", ["Quand vous sortez ou partez, merci d'éteindre les lumières, la climatisation et les prises électriques.", "Pas de chaussures à l'intérieur, s'il vous plaît.", "Interdiction de fumer partout, balcon compris (amende jusqu'à KRW 200,000).", "Pas de plats à forte odeur (une cuisson simple au grill, c'est possible). Allumez la ventilation au plafond pendant la cuisson.", "Utilisez un seul appareil puissant à la fois (sèche-linge, lave-linge, plaque à induction, micro-ondes, sèche-cheveux).", "L'accès à la pièce 'Staff Only' à côté du lave-linge est interdit.", "Les dégâts importants ou les taches tenaces peuvent être facturés. Merci de ne pas manger sur les lits.", "Déchets : consultez la page à part, [[Comment jeter les déchets|trash]]."]], ["4. Départ", ["Avant 11:00 AM. Un départ tardif peut être facturé par tranche de 10 minutes."]]], "thanks": "Merci de nous aider à tout préparer pour les prochains voyageurs"}, "de": {"title": "Gästeinformationen", "lead": "Willkommen im Blue Plane Stay", "secs": [["1. Ankunft", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). Das Gebäude mit dem Schild '고기온' im Erdgeschoss.", "Check-in ab 4:00 PM / Check-out bis 11:00 AM", "Self-Check-in: Wir senden Ihnen den Türcode am Anreisetag um 3:00 PM.", "Im Gebäude gibt es keine Parkplätze. Nutzen Sie gern die Tiefgarage im CJ-Gebäude direkt nebenan (24 Stunden geöffnet, KRW 1,000 pro 10 Min., maximal KRW 30,000 pro Tag, ab Mitternacht wird neu berechnet).", "Die Treppe ist steil. Bitte halten Sie sich am rechten Handlauf fest. Brauchen Sie Hilfe mit dem Gepäck? Sagen Sie uns einfach Bescheid."]], ["2. In der Wohnung", ["WLAN: blueplane / Passwort: 12341234", "Hauptlichtschalter: an der rechten Wand am Eingang", "Fernseher: Wie er funktioniert, steht in der [[Anleitung Fernseher|tv]].", "Warmes Wasser braucht einen Moment. Lassen Sie den Hahn kurz laufen.", "Bad: Shampoo, Duschgel, Spülung / Waschtisch: Föhn, Glätteisen", "Bettwäsche, Handtücher, Hausschuhe und Badematten werden nach jedem Aufenthalt gewaschen."]], ["3. Bitte beachten", ["Wenn Sie ausgehen oder abreisen, schalten Sie bitte Licht, Klimaanlage und Steckdosen aus.", "Bitte keine Schuhe in der Wohnung.", "Rauchen ist überall verboten, auch auf dem Balkon (Strafe bis zu KRW 200,000).", "Bitte keine stark riechenden Speisen kochen (einfaches Anbraten ist in Ordnung). Schalten Sie beim Kochen den Deckenlüfter ein.", "Bitte immer nur ein Gerät mit hoher Leistung gleichzeitig nutzen (Trockner, Waschmaschine, Induktionsherd, Mikrowelle, Föhn).", "Der Raum 'Staff Only' neben der Waschmaschine darf nicht betreten werden.", "Schwere Schäden oder Flecken können in Rechnung gestellt werden. Bitte essen Sie nicht im Bett.", "Müll: Bitte sehen Sie in der separaten [[Anleitung Müllentsorgung|trash]] nach."]], ["4. Check-out", ["Bis 11:00 AM. Ein später Check-out kann in 10-Minuten-Schritten berechnet werden."]]], "thanks": "Danke, dass Sie uns helfen, alles für die nächsten Gäste vorzubereiten"}, "ms": {"title": "Maklumat Penginapan", "lead": "Selamat datang ke Blue Plane Stay", "secs": [["1. Ketibaan", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). Bangunan dengan papan tanda '고기온' di tingkat bawah.", "Daftar masuk dari 4:00 PM / Daftar keluar sebelum 11:00 AM", "Daftar masuk sendiri: kami akan menghantar kod kunci pintu pada 3:00 PM pada hari daftar masuk anda.", "Tiada tempat letak kereta di bangunan ini. Anda boleh guna tempat letak kereta bawah tanah Bangunan CJ di sebelah (24 jam, KRW 1,000 setiap 10 min, maksimum KRW 30,000 sehari, dikira semula selepas tengah malam).", "Tangganya curam. Sila pegang susur tangan sebelah kanan. Perlukan bantuan membawa beg? Beritahu kami sahaja."]], ["2. Di dalam apartmen", ["Wi-Fi: blueplane / Kata laluan: 12341234", "Suis utama lampu: di dinding kanan pintu masuk", "TV: cara penggunaan boleh dilihat dalam [[Panduan TV|tv]].", "Air panas mengambil sedikit masa. Biarkan paip terbuka sebentar.", "Bilik mandi: syampu, sabun mandi, perapi rambut / Sinki kering: pengering rambut, pelurus rambut", "Cadar, tuala, selipar dan alas kaki bilik mandi dibasuh selepas setiap penginapan."]], ["3. Sila ambil perhatian", ["Apabila keluar atau daftar keluar, sila tutup lampu, penghawa dingin dan suis soket elektrik.", "Sila tanggalkan kasut di dalam rumah.", "Dilarang merokok di mana-mana, termasuk balkoni (denda sehingga KRW 200,000).", "Jangan masak makanan berbau kuat (memanggang ringkas dibenarkan). Hidupkan kipas ekzos di siling semasa memasak.", "Guna satu perkakas berkuasa tinggi pada satu masa (pengering, mesin basuh, dapur induksi, ketuhar gelombang mikro, pengering rambut).", "Bilik 'Staff Only' di sebelah mesin basuh tidak boleh dimasuki.", "Kerosakan atau kotoran yang teruk mungkin dikenakan caj. Sila jangan makan di atas katil.", "Sampah: sila rujuk halaman berasingan [[Panduan Buang Sampah|trash]]."]], ["4. Daftar keluar", ["Sebelum 11:00 AM. Daftar keluar lewat mungkin dikenakan caj bagi setiap 10 minit."]]], "thanks": "Terima kasih kerana membantu kami bersedia untuk tetamu seterusnya"}, "tl": {"title": "Impormasyon sa Tuluyan", "lead": "Maligayang pagdating sa Blue Plane Stay", "secs": [["1. Pagdating", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). Ang gusaling may karatulang '고기온' sa ground floor.", "Check-in mula 4:00 PM / Check-out hanggang 11:00 AM", "Self check-in: ipapadala namin ang code ng door lock nang 3:00 PM sa araw ng inyong check-in.", "Walang paradahan sa gusali. Puwede kayong pumarada sa underground parking ng CJ Building sa tabi (24 oras, KRW 1,000 kada 10 min, hanggang KRW 30,000 kada araw, nagre-reset pagsapit ng hatinggabi).", "Matarik ang hagdan. Pakihawakan ang hawakan sa kanan. Kailangan ng tulong sa bagahe? Sabihan lang po kami."]], ["2. Sa loob ng tuluyan", ["Wi-Fi: blueplane / Password: 12341234", "Master switch ng ilaw: sa kanang dingding sa may pasukan", "TV: para sa paggamit, pakitingnan ang [[Gabay sa TV|tv]].", "Medyo matagal bago lumabas ang mainit na tubig. Hayaang nakabukas sandali ang gripo.", "Banyo: shampoo, body wash, conditioner / Lababo sa labas ng banyo: hair dryer, hair straightener", "Nilalabhan ang kumot, tuwalya, tsinelas, at bath mat pagkatapos ng bawat pananatili."]], ["3. Mga paalala", ["Kapag lalabas o aalis na, pakipatay ang ilaw, aircon, at mga saksakan.", "Bawal ang sapatos sa loob.", "Bawal manigarilyo kahit saan, kasama ang balkonahe (multa hanggang KRW 200,000).", "Bawal magluto ng pagkaing matapang ang amoy (puwede ang simpleng pag-ihaw). Buksan ang exhaust fan sa kisame habang nagluluto.", "Isa-isang gamitin ang mga high-power na appliance (dryer, washer, induction, microwave, hair dryer).", "Bawal pumasok sa kuwartong 'Staff Only' sa tabi ng washer.", "Maaaring singilin ang malubhang sira o mantsa. Pakiusap, huwag kumain sa kama.", "Basura: pakitingnan ang hiwalay na [[Gabay sa Pagtatapon ng Basura|trash]]."]], ["4. Check-out", ["Hanggang 11:00 AM. Maaaring may singil ang late check-out kada 10 minuto."]]], "thanks": "Salamat sa pagtulong na maihanda ang tuluyan para sa susunod na mga bisita"}, "ru": {"title": "Памятка для гостей", "lead": "Добро пожаловать в Blue Plane Stay", "secs": [["1. Приезд", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). Здание с вывеской '고기온' на первом этаже.", "Заезд с 4:00 PM / Выезд до 11:00 AM", "Самостоятельное заселение: код от дверного замка мы присылаем в 3:00 PM в день заезда.", "Парковки в здании нет. Можно воспользоваться подземной парковкой соседнего здания CJ (24 часа, KRW 1,000 за 10 мин, максимум KRW 30,000 в день, после полуночи отсчёт начинается заново).", "Лестница крутая. Пожалуйста, держитесь за правый поручень. Нужна помощь с багажом? Просто сообщите нам."]], ["2. В квартире", ["Wi-Fi: blueplane / Пароль: 12341234", "Общий выключатель света: на правой стене у входа", "Телевизор: как им пользоваться, смотрите в [[Инструкции к телевизору|tv]].", "Горячая вода идёт не сразу. Оставьте кран открытым ненадолго.", "Ванная: шампунь, гель для душа, кондиционер / Умывальник вне душевой: фен, выпрямитель для волос", "Постельное бельё, полотенца, тапочки и коврики для ванной стираются после каждого проживания."]], ["3. Пожалуйста, соблюдайте", ["Уходя из квартиры или при выезде, пожалуйста, выключите свет, кондиционер и питание розеток.", "Пожалуйста, не ходите в обуви внутри.", "Курение запрещено везде, включая балкон (штраф до KRW 200,000).", "Не готовьте блюда с сильным запахом (простое обжаривание можно). Во время готовки включайте вытяжной вентилятор на потолке.", "Включайте мощные приборы по одному (сушилка, стиральная машина, индукционная плита, микроволновка, фен).", "В комнату 'Staff Only' рядом со стиральной машиной входить нельзя.", "За серьёзные повреждения или пятна может взиматься плата. Пожалуйста, не ешьте на кроватях.", "Мусор: смотрите отдельную страницу [[Как выбрасывать мусор|trash]]."]], ["4. Выезд", ["До 11:00 AM. За поздний выезд может взиматься плата за каждые 10 минут."]]], "thanks": "Спасибо, что помогаете нам подготовиться к следующим гостям"}, "mn": {"title": "Байрны мэдээлэл", "lead": "Blue Plane Stay-д тавтай морил", "secs": [["1. Ирэх үед", ["3F, 291 Toegye-ro, Jung-gu, Seoul (155-5 Ssangnim-dong). Нэгдүгээр давхарт нь '고기온' гэсэн хаягтай барилга.", "Орох: 4:00 PM-ээс хойш / Гарах: 11:00 AM-аас өмнө", "Өөрөө орох: орох өдрийн 3:00 PM-д хаалганы цоожны кодыг илгээнэ.", "Барилгад зогсоол байхгүй. Хажуугийн CJ барилгын газар доорх зогсоолыг ашиглаарай (24 цаг, 10 минут тутам KRW 1,000, өдөрт дээд тал нь KRW 30,000, шөнө дундаас дахин тооцно).", "Шат эгц. Баруун талын бариулаас барьж явна уу. Ачаа зөөхөд тусламж хэрэгтэй бол бидэнд хэлээрэй."]], ["2. Байрны дотор", ["Wi-Fi: blueplane / Нууц үг: 12341234", "Бүх гэрлийн үндсэн унтраалга: орох хаалганы баруун талын хананд", "Зурагт: хэрэглэх аргыг [[Зурагт ашиглах заавар|tv]]-аас харна уу.", "Халуун ус гартал бага зэрэг хугацаа шаардана. Усаа хэсэг гоожуулж хүлээнэ үү.", "Угаалгын өрөө: шампунь, шингэн саван, ангижруулагч / Гадна угаалтуур: үс хатаагч, үс тэгшлэгч", "Ор хөнжлийн даавуу, алчуур, шаахай, хөлийн дэвсгэрийг зочин бүрийн дараа угаадаг."]], ["3. Анхаарна уу", ["Гадагш гарах болон байрнаас гарахдаа гэрэл, агааржуулагч, залгуурын цахилгааныг унтраана уу.", "Байранд гутлаа тайлна уу.", "Тагтан дээр ч мөн хаана ч тамхи татахыг хориглоно (торгууль дээд тал нь KRW 200,000).", "Хүчтэй үнэртэй хоол хийхгүй байна уу (энгийн шарсан хоол болно). Хоол хийхдээ таазны агааржуулах сэнсийг асаана уу.", "Өндөр хүчин чадалтай цахилгаан хэрэгслийг нэг нэгээр нь хэрэглэнэ үү (хатаагч, угаалгын машин, индукц плитка, богино долгионы зуух, үс хатаагч).", "Угаалгын машины хажууд байрлах 'Staff Only' өрөөнд орохыг хориглоно.", "Ноцтой эвдрэл, толбо гаргавал нэмэлт төлбөр гарч болно. Орон дээр хоол идэхгүй байна уу.", "Хог: тусдаа [[Хог хаях заавар|trash]]-ыг харна уу."]], ["4. Гарах", ["11:00 AM-аас өмнө. Хоцорч гарвал 10 минут тутамд нэмэлт төлбөр гарч болно."]]], "thanks": "Дараагийн зочдод бэлтгэхэд тусалсанд баярлалаа"}};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (s, l) => esc(s).replace(/(KRW [\d,]+|'고기온'|\d{1,2}:\d{2} [AP]M)/g, '<span class="nw">$1</span>').replace(/\[\[([^|\]]+)\|(tv|trash)\]\]/g, (m, a, k) => `<a href="../${k}/?lang=${encodeURIComponent(l)}">${a}</a>`);
function show(l){
  const t = T[l] || T.en;
  document.documentElement.lang = l;
  document.title = t.title + " | Blue Plane Stay";
  document.getElementById("home").href = "../guide/?lang=" + encodeURIComponent(l);
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-lead").textContent = t.lead + " ✈️";
  document.getElementById("t-secs").innerHTML = t.secs.map(([h, rows], i) =>
    `<section class="sec"><h2>${esc(h)}</h2><ul class="rows">${rows.map((x, j) => `<li><span class="ic" aria-hidden="true">${ICONS[i][j]}</span><span class="tx">${fmt(x, l)}</span></li>`).join("")}</ul></section>`).join("");
  document.getElementById("t-thanks").textContent = t.thanks + " 💛";
  document.getElementById("lang").value = T[l] ? l : "en";
  try { localStorage.setItem("house_lang", l); } catch (e) {}
}
document.getElementById("lang").addEventListener("change", e => show(e.target.value));
let pick = "";
try { pick = localStorage.getItem("house_lang") || ""; } catch (e) { pick = ""; }
const qLang = new URLSearchParams(location.search).get("lang");
if (qLang && T[qLang]) pick = qLang;
if (!pick) {
  const n = (navigator.language || "en").toLowerCase();
  const base = n.split("-")[0];
  pick = n.startsWith("zh") ? (/tw|hk|hant/.test(n) ? "zh-Hant" : "zh-Hans") : (["ko","ja","vi","th","id","es","fr","de","ms","tl","ru","mn"].includes(base) ? base : ({in: "id", fil: "tl"}[base] || "en"));
}
show(T[pick] ? pick : "en");
</script>
